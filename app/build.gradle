plugins {
    id 'com.android.application'
}

android {
    namespace 'qa.moveproof.inspection'
    compileSdk 36

    defaultConfig {
        applicationId 'qa.moveproof.inspection'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '0.6.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
}
